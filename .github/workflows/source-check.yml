name: Source integrity and Wiki
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate provenance and evidence boundaries
        run: python3 scripts/check_source.py
      - name: Compile board overlay
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler
          make overlay

      - name: Board configuration safety checks (offline only)
        run: |
          python3 -m unittest discover -s tests -v
          for f in board/*.sh; do bash -n "$f"; done

      - name: Build and check teaching Wiki
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r wiki/requirements.txt
          .venv/bin/python wiki/build.py
          .venv/bin/python wiki/check.py
          node --check wiki/assets/app.js

      - name: Publish Wiki to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WIKI_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.WIKI_CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.152.0 pages deploy wiki/dist --project-name ymbot-5io-wiki --branch main --commit-hash "$GITHUB_SHA"
